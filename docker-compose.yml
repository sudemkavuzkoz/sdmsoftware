version: '3.8'

services:
  sdm-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdmsoftware-platform
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
